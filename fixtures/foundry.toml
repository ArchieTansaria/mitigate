[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
extra_output = ["storageLayout"]
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "oracle-testpack/=testpack/"]
fs_permissions = [{ access = "read-write", path = "./generated" }]

[profile.default.fuzz]
runs = 256
